<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muebles Marinella - Catálogo</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <header class="header">
        <div class="header-content">
            <a href="/" style="text-decoration:none; color:inherit;"><h1 class="logo">Muebles Marinella</h1></a>
            <button id="btn-carrito" class="btn-carrito">
                🛒 Carrito <span id="contador-carrito" class="contador">0</span>
            </button>
        </div>
    </header>

    <section class="filtros">
        <input type="text" id="buscador" placeholder="Buscar mueble...">
        <select id="filtro-categoria">
            <option value="">Todas las categorías</option>
        </select>
    </section>

    <main class="catalogo" id="catalogo">
        <!-- Los productos se cargan aqui dinamicamente con JS -->
        <p id="mensaje-carga">Cargando muebles...</p>
    </main>

    <!-- Modal de detalle de producto -->
    <div id="modal-producto" class="modal oculto">
        <div class="modal-contenido">
            <span class="cerrar-modal" id="cerrar-modal-producto">&times;</span>
            <div id="detalle-producto"></div>
        </div>
    </div>

    <!-- Panel lateral del carrito -->
    <div id="panel-carrito" class="panel-carrito oculto">
        <div class="panel-carrito-header">
            <h2>Tu carrito</h2>
            <span class="cerrar-modal" id="cerrar-carrito">&times;</span>
        </div>
        <div id="items-carrito" class="items-carrito"></div>
        <div class="panel-carrito-footer">
            <p class="total-carrito">Total: <span id="total-carrito">$0</span></p>
            <button id="btn-whatsapp" class="btn-whatsapp">
                Confirmar pedido por WhatsApp
            </button>
        </div>
    </div>

    <div id="overlay" class="overlay oculto"></div>

    <script src="/js/color-fondo.js"></script>
    <script src="/js/carrito.js"></script>
    <script src="/js/catalogo.js"></script>
</body>
</html>
