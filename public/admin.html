<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Muebles Marinella</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

    <!-- Vista de login -->
    <div id="vista-login" class="login-container">
        <div class="login-card">
            <h1>Muebles Marinella</h1>
            <p class="subtitulo">Panel de administración</p>
            <form id="form-login">
                <input type="text" id="login-email" placeholder="Correo electrónico" required>
                <input type="password" id="login-password" placeholder="Contraseña" required>
                <button type="submit">Iniciar sesión</button>
                <p id="login-error" class="error oculto"></p>
            </form>
        </div>
    </div>

    <!-- Vista del panel (oculta hasta hacer login) -->
    <div id="vista-panel" class="oculto">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">Panel Admin - Muebles Marinella</h1>
                <div>
                    <span id="admin-nombre" class="admin-nombre"></span>
                    <button id="btn-logout" class="btn-logout">Cerrar sesión</button>
                </div>
            </div>
        </header>

        <nav class="admin-tabs">
            <button class="tab-btn activo" data-tab="productos">Productos</button>
            <button class="tab-btn" data-tab="stats">Más vistos</button>
        </nav>

        <!-- Tab: productos -->
        <section id="tab-productos" class="admin-tab">
            <div class="admin-toolbar">
                <h2>Gestionar productos</h2>
                <button id="btn-nuevo-producto" class="btn-primario">+ Nuevo producto</button>
            </div>
            <input type="text" id="admin-buscador" placeholder="Buscar producto por nombre..." class="admin-buscador">
            <div id="tabla-productos" class="tabla-productos">
                <p>Cargando productos...</p>
            </div>
        </section>

        <!-- Tab: estadisticas -->
        <section id="tab-stats" class="admin-tab oculto">
            <h2>Productos más vistos</h2>
            <div id="lista-stats" class="lista-stats">
                <p>Cargando estadísticas...</p>
            </div>
        </section>
    </div>

    <!-- Modal para crear/editar producto -->
    <div id="modal-form-producto" class="modal oculto">
        <div class="modal-contenido">
            <span class="cerrar-modal" id="cerrar-modal-form">&times;</span>
            <h2 id="titulo-form-producto">Nuevo producto</h2>
            <form id="form-producto">
                <input type="hidden" id="producto-id">
                <label>Nombre</label>
                <input type="text" id="producto-nombre" required>

                <label>Descripción</label>
                <textarea id="producto-descripcion" rows="3"></textarea>

                <label>Precio (COP)</label>
                <input type="number" id="producto-precio" min="0" step="1000" required>

                <label>Categoría</label>
                <input type="text" id="producto-categoria" placeholder="Ej: Salas, Comedores, Dormitorios">

                <label>Foto del mueble</label>
                <input type="file" id="producto-imagen-archivo" accept="image/jpeg,image/png,image/webp">
                <input type="hidden" id="producto-imagen">
                <div id="preview-imagen" class="preview-imagen oculto">
                    <img id="preview-imagen-img" src="" alt="Vista previa">
                    <span id="preview-imagen-estado"></span>
                    <button type="button" id="btn-quitar-imagen" class="btn-quitar-foto">Quitar foto</button>
                </div>

                <label>Segunda foto (opcional)</label>
                <input type="file" id="producto-imagen-archivo-2" accept="image/jpeg,image/png,image/webp">
                <input type="hidden" id="producto-imagen-2">
                <div id="preview-imagen-2" class="preview-imagen oculto">
                    <img id="preview-imagen-img-2" src="" alt="Vista previa 2">
                    <span id="preview-imagen-estado-2"></span>
                    <button type="button" id="btn-quitar-imagen-2" class="btn-quitar-foto">Quitar foto</button>
                </div>

                <label>Etiqueta destacada (opcional)</label>
                <select id="producto-etiqueta">
                    <option value="">Sin etiqueta</option>
                    <option value="nuevo">Nuevo</option>
                    <option value="mas_vendido">Más vendido</option>
                </select>

                <div class="fila-medidas">
                    <div>
                        <label>Ancho (cm)</label>
                        <input type="number" id="producto-ancho" min="0" step="0.1">
                    </div>
                    <div>
                        <label>Largo (cm)</label>
                        <input type="number" id="producto-largo" min="0" step="0.1">
                    </div>
                    <div>
                        <label>Alto (cm)</label>
                        <input type="number" id="producto-alto" min="0" step="0.1">
                    </div>
                </div>

                <button type="submit" class="btn-primario">Guardar producto</button>
                <p id="form-producto-error" class="error oculto"></p>
            </form>
        </div>
    </div>

    <div id="overlay" class="overlay oculto"></div>

    <script src="/js/admin.js"></script>
</body>
</html>
